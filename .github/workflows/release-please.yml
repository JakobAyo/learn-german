# Keeps one release PR open on main; merging it tags vX.Y.Z and publishes a
# GitHub Release (0020). Details in docs/development/ci-and-releases.md.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pitfall 2: a PR opened with GITHUB_TOKEN triggers no workflows, so the
      # release PR's required checks would never run. Use a fine-grained token
      # limited to this repository (contents + pull requests: write).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pitfall 1: uv.lock records the project's own version. release-please
      # bumps only pyproject.toml, so refresh the lock on the release branch,
      # or the release PR fails `uv lock --check`.
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        name: Refresh uv.lock on the release branch
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: update uv.lock for release"
          git push
