# The PR title becomes the squash commit that release-please reads (0020),
# so it must be a Conventional Commit. Required check on main.
name: PR title

on:
  # pull_request_target so the check also runs when only the title is edited.
  # Safe here: the job never checks out or runs code from the PR.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            ci
            build
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary "{subject}" in "{title}" must start with a lowercase letter.
